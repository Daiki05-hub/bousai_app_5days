<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #0b4f7d;
      --primary-deep: #0a3e66;
      --panel: #f3f6f8;
      --panel-border: #dfe7ee;
      --text: #1d2d3d;
      --muted: #5f7383;
      --accent: #3ebf7c;
      --soft-blue: #dfeef9;
      --shadow: rgba(18, 63, 89, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Yu Gothic", "Hiragino Sans", "Segoe UI", sans-serif;
      background: #efefef;
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-deep) 100%);
      height: 72px;
      box-shadow: 0 2px 8px rgba(9, 42, 70, 0.12);
    }

    .topbar-inner {
      max-width: 980px;
      height: 100%;
      margin: 0 auto;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(1.6rem, 2vw, 2.1rem);
      letter-spacing: 0.05em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.12);
    }

    .menu-button {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 1.6rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .menu-button:hover {
      background: rgba(255,255,255,0.12);
    }

    main {
      max-width: 980px;
      margin: 20px auto 0;
      padding: 0 18px 40px;
    }

    .page-shell {
      max-width: 820px;
      margin: 0 auto;
    }

    .nav-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.45);
      color: var(--muted);
      font-size: 0.9rem;
      flex-wrap: wrap;
    }

    .nav-inline a {
      color: var(--primary-deep);
      text-decoration: none;
      font-weight: 600;
    }

    .nav-inline a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .topbar {
        height: 64px;
      }
      .topbar-inner {
        padding: 0 16px;
      }
      .nav-inline {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">防災アプリ</div>
      <button class="menu-button" type="button" aria-label="メニュー">☰</button>
    </div>
  </header>

  <main>
    <div class="page-shell">
      <nav class="nav-inline" aria-label="メインメニュー">
        <a href="/">ホーム</a> |
        <a href="/shelter_search">避難所検索</a> |
        <a href="/shelter_register">避難所登録</a> |
        <a href="/board">指示・発信ボード</a>
        {% if session.logged_in %}
          ｜
          <span>ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
          <a href="/logout">ログアウト</a>
        {% else %}
          ｜
          <span>未ログイン</span>
          <a href="/login">ログイン</a>
        {% endif %}
      </nav>

      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
