{% extends "base.html" %}

{% block content %}
<style>
  .panel {
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    box-shadow: 0 8px 18px var(--shadow);
    overflow: hidden;
    margin-top: 22px;
  }

  .map-panel {
    padding: 18px 18px 14px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .map-title, .weather-title {
    color: var(--primary-deep);
    font-size: 1.2rem;
    font-weight: 800;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .title-icon {
    display: inline-flex;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #0f7ad8;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.9);
    position: relative;
  }

  .title-icon::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .title-icon.weather {
    border-radius: 50%;
    width: 18px;
    height: 18px;
    background: linear-gradient(180deg, #7bc8ff, #125da8);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.8);
  }

  .title-icon.weather::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(255,255,255,0.9);
    clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .shelter-map {
    height: 325px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(128, 152, 170, 0.28);
    background: linear-gradient(180deg, #bfe8f6 0%, #cfeaf5 100%);
  }

  .weather-panel {
    padding: 20px 22px 18px;
  }

  .weather-header {
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #dfe7ee;
  }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    background: rgba(62, 191, 124, 0.1);
    color: #1f9a5f;
    font-weight: 700;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.95rem;
  }

  .refresh-btn::before {
    content: "↻";
    font-size: 1.1rem;
    display: inline-block;
    transform: translateY(-1px);
  }

  .weather-content {
    padding: 8px 0 0;
    color: var(--text);
  }

  .weather-content .location {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 12px;
    font-size: 1.05rem;
    color: var(--primary-deep);
    font-weight: 700;
  }

  .weather-content .location::before {
    content: "◉";
    color: var(--primary);
    font-size: 0.9rem;
  }

  .weather-status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 12px;
    color: #1b8d54;
    font-weight: 700;
  }

  .weather-status::before {
    content: "✓";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #dff7ea;
    color: #1f9a5f;
    font-size: 0.9rem;
  }

  .weather-meta {
    margin: 8px 0 0;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
  }

  .weather-meta::before {
    content: "◌";
    color: #5b8db1;
    font-size: 0.9rem;
  }

  .weather-meta strong {
    color: var(--primary-deep);
    font-weight: 700;
  }

  @media (max-width: 640px) {
    .weather-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .refresh-btn {
      width: 100%;
      justify-content: center;
    }
  }
</style>

<div class="panel map-panel">
  <div class="section-header">
    <span class="title-icon" aria-hidden="true"></span>
    <h2 class="map-title">避難所マップ</h2>
  </div>
  <div id="shelterMap" class="shelter-map"></div>
</div>

<div class="panel weather-panel">
  <div class="section-header weather-header">
    <div class="section-header" style="margin:0; gap:10px;">
      <span class="title-icon weather" aria-hidden="true"></span>
      <h2 class="weather-title">青森市 気象警報・注意報</h2>
    </div>
    <button type="button" class="refresh-btn" id="refreshWeather">10分おき自動更新</button>
  </div>

  <div id="weatherContent" class="weather-content">
    <p>読み込み中...</p>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  function updateWeatherWarnings() {
    fetch('/api/weather_warnings')
      .then(response => response.json())
      .then(data => {
        updateWeatherContent(data);
      })
      .catch(() => {
        const weatherContent = document.getElementById('weatherContent');
        weatherContent.innerHTML = '<p>気象情報の取得に失敗しました。</p>';
      });
  }

  function updateWeatherContent(data) {
    const weatherContent = document.getElementById('weatherContent');

    if (data.error) {
      weatherContent.innerHTML = '<p>気象情報の取得に失敗しました。</p>';
      return;
    }

    let warningsHtml = '<div class="weather-status">現在、警報・注意報は発表されていません</div>';
    if (data.warnings && data.warnings.length > 0) {
      warningsHtml = '<ul style="margin:0 0 12px 1.2rem; padding-left:0; color:#0d3d5f;">' +
        data.warnings.map(warning => `<li>${warning.name}（${warning.status}）</li>`).join('') +
        '</ul>';
    }

    weatherContent.innerHTML = `
      <div class="location">${data.area_name || '青森市'}</div>
      ${warningsHtml}
      <div class="weather-meta"><strong>最終確認:</strong> ${data.last_fetch_time || '更新中...'}</div>
      <div class="weather-meta"><strong>気象庁最終発表:</strong> ${data.report_time || '不明'}</div>
    `;
  }

  updateWeatherWarnings();
  setInterval(updateWeatherWarnings, 600000);

  const refreshButton = document.getElementById('refreshWeather');
  if (refreshButton) {
    refreshButton.addEventListener('click', updateWeatherWarnings);
  }
});
</script>
{% endblock %}
